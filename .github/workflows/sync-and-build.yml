name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Ensure .github is never merged from upstream
        run: |
          git config merge.ours.driver true
          if [ -f .gitattributes ]; then
            grep -qxF '.github/** merge=ours' .gitattributes || echo '.github/** merge=ours' >> .gitattributes
          else
            echo '.github/** merge=ours' > .gitattributes
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .gitattributes 2>/dev/null || [ -n "$(git status --porcelain .gitattributes)" ]; then
            git add .gitattributes
            git commit -m "chore: never merge .github from upstream" || true
            git push origin HEAD:main
          fi

      - name: Fetch and merge upstream/main
        id: sync
        run: |
          git remote add upstream https://github.com/MetrolistGroup/Metrolist.git
          git fetch upstream main

          BEFORE=$(git rev-parse HEAD)

          # merge=ours already protects .github; for every other path,
          # prefer upstream's side automatically instead of hard-failing.
          if git merge upstream/main --no-edit -X theirs; then
            echo "Merge completed cleanly (or auto-resolved via -X theirs)."
          else
            echo "::error::Merge hit a conflict Git couldn't auto-resolve (likely a delete/modify or binary/submodule conflict). Manual fix required."
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)

          if git diff --quiet "$BEFORE" "$AFTER"; then
            echo "No changes — nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:main
            echo "Pushed new changes."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
